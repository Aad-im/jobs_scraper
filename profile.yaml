# Subtracted after the tier score — these are things he has no background in.
role_penalties:
  - {points: 30, keywords: ["asic", "fpga", "rtl", "vlsi", "silicon", "physical design",
                            "analog design", "verification engineer", "firmware",
                            "embedded", "mechanical engineer", "electrical engineer",
                            "process engineer", "manufacturing", "chip design",
                            "semiconductor", "wafer", "lithography", "optical"]}
  - {points: 22, keywords: ["clinical", "biolog", "chemist", "laboratory", "pharma",
                            "regulatory", "actuarial", "audit", "tax ", "supply chain",
                            "logistics", "civil engineer", "aerospace structure"]}
  - {points: 14, keywords: ["trader", "trading", "quant research", "portfolio manager"]}
  - {points: 10, keywords: ["frontend engineer", "front-end engineer", "mobile engineer",
                            "ios engineer", "android engineer", "game engineer",
                            "gameplay", "qa engineer", "test engineer", "salesforce developer"]}

