# ---------------------------------------------------------------------------
# Candidate profile — drives the "Top picks" shortlist (src/fit.py).
#
# Derived from Aadi Malaviya's resume (UCLA BS Math/CS + Stats/DS minor, June
# 2026; UCLA NLP Lab LLM interpretability; founding engineer at Ryniant; MLE at
# Chelle AI; data analyst at Genter Capital). Edit the weights and keyword lists
# here to re-rank the shortlist — no code changes needed.
#
# Location is deliberately NOT scored: the shortlist answers "is this the right
# job for me", and where it is belongs in the location filter instead.
# ---------------------------------------------------------------------------

shortlist:
  # A role needs at least this score (0-100) to appear under "Top picks".
  # Below ~74 the list fills with generic "AI Engineer" reqs at companies with no
  # ML org, which score well on the title alone and crowd out the real matches.
  min_score: 74
  # Hard cap on the shortlist so it stays a to-do list, not another firehose.
  max_size: 80
  # At most this many roles from any one company, so a single big board with 40
  # near-identical reqs can't crowd everyone else out.
  max_per_company: 3
  # Full-time scores strictly higher than an internship, so on raw score alone
  # internships all but vanish from the list. Reserve slots so the intern path
  # stays a usable list of its own when you filter the picks by role type.
  reserve_intern: 15

weights:
  role: 45          # how close the role itself is to what he does
  employer: 25      # frontier lab > big tech > AI infra > other
  skills: 20        # concrete stack overlap found in title/description
  stage: 10         # new-grad vs intern vs quietly-senior
  freshness: 10     # recent postings are the ones still open

# ---- 1. Role match --------------------------------------------------------
# First tier whose keywords hit the title wins; description-only hits score half.
role_tiers:
  core:             # bullseye — his exact background
    score: 45
