# ---- 4. Stage / eligibility ----------------------------------------------
stage:
  new_grad: 10       # graduated June 2026 — full-time is the primary target
  intern: 4          # kept as a fallback path, ranked below full-time
  # Bonus when the posting names a class year he qualifies for.
  target_years: [2026, 2027]
  target_year_bonus: 2
  penalties:
    phd: 12          # "PhD required/preferred" — he has a BS
    masters: 3
    years_3plus: 10  # a 3+ year experience bar in the body
  # Surfaced as a warning chip on the card rather than a hard filter.
  flag_keywords:
    phd: ["ph.d", "phd", "doctorate", "doctoral"]
    masters: ["master's degree", "masters degree", "ms degree", "m.s. degree"]
    clearance: ["security clearance", "ts/sci", "top secret", "polygraph"]
    citizenship: ["us citizen", "u.s. citizen", "citizenship required"]

# ---- 5. Freshness ---------------------------------------------------------
# Days since posting -> score. First matching bucket wins.
freshness:
  buckets:
    - {max_days: 3,  score: 10}
    - {max_days: 7,  score: 8}
    - {max_days: 14, score: 6}
    - {max_days: 30, score: 3}
    - {max_days: 60, score: 1}
  unknown_score: 3
